<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка доставки</title>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --line: #d9e0e7;
      --text: #16202a;
      --muted: #61707f;
      --accent: #1657c4;
      --accent-dark: #0e3f92;
      --ok: #217346;
      --shadow: 0 22px 50px rgba(15, 35, 59, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(22, 87, 196, 0.08), transparent 28%),
        linear-gradient(180deg, #f5f7fa 0%, #e9eef3 100%);
    }

    .shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .title h1 {
      margin: 0 0 6px;
      font-size: 34px;
      line-height: 1.05;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn, .link-btn {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: 0.18s ease;
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .btn.primary:hover { background: var(--accent-dark); }
    .btn.ghost {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn.ghost:hover { background: #f7f9fb; }

    .link-btn {
      background: #0f2033;
      color: #fff;
      display: inline-flex;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .card {
      grid-column: span 12;
      background: var(--panel);
      border: 1px solid rgba(217, 224, 231, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .card.half { grid-column: span 6; }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .subgrid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .field, .item {
      grid-column: span 12;
    }

    .item.third { grid-column: span 4; }
    .item.half { grid-column: span 6; }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-transform: uppercase;
    }

    input, textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 110px; resize: vertical; }
    .small textarea { min-height: 84px; }
    .small input { min-height: 46px; }

    .status {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ok);
      min-height: 20px;
    }

    @media (max-width: 980px) {
      .card.half, .item.third, .item.half { grid-column: span 12; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="title">
        <h1>Админка страницы доставки</h1>
        <p>Редактирует данные для <code>aiteross_delivery_overrides</code> и страницы <code>Доставка.dc.html</code>.</p>
      </div>
      <div class="actions">
        <a class="link-btn" href="./Доставка.dc.html" target="_blank" rel="noreferrer">Открыть доставку</a>
        <button class="btn ghost" id="resetBtn" type="button">Сбросить</button>
        <button class="btn primary" id="saveBtn" type="button">Сохранить</button>
      </div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Hero и склад</h2>
        <div class="subgrid">
          <div class="field">
            <label for="intro">Описание</label>
            <textarea id="intro"></textarea>
          </div>
          <div class="item third small">
            <label for="warehouseAddress">Адрес склада</label>
            <input id="warehouseAddress" />
          </div>
          <div class="item third small">
            <label for="warehousePhone">Телефон</label>
            <input id="warehousePhone" />
          </div>
          <div class="item third small">
            <label for="warehouseHours">Часы работы</label>
            <input id="warehouseHours" />
          </div>
          <div class="item third small">
            <label for="heroStats">Метрики hero</label>
            <textarea id="heroStats" placeholder="24 ч | обычный срок подтверждения маршрута&#10;10 шт. | минимальная партия"></textarea>
          </div>
          <div class="item third small">
            <label for="sideNotes">Заметки справа</label>
            <textarea id="sideNotes" placeholder="Согласуем способ отправки | Подбираем схему поставки..."></textarea>
          </div>
          <div class="item third small">
            <label for="deliveryCards">Карточки доставки</label>
            <textarea id="deliveryCards" placeholder="Доставка по Санкт-Петербургу | Текст | Городские поставки"></textarea>
          </div>
        </div>
      </section>

      <section class="card half">
        <h2>Процесс и сценарии</h2>
        <div class="subgrid">
          <div class="field small">
            <label for="processSteps">Шаги процесса</label>
            <textarea id="processSteps" placeholder="01 | Подтверждаем состав заказа | Текст"></textarea>
          </div>
          <div class="field small">
            <label for="coverageList">Сценарии поставки</label>
            <textarea id="coverageList" placeholder="Срочные поставки по городу | Текст"></textarea>
          </div>
        </div>
      </section>

      <section class="card half">
        <h2>Условия и документы</h2>
        <div class="subgrid">
          <div class="field small">
            <label for="conditions">Условия</label>
            <textarea id="conditions"></textarea>
          </div>
          <div class="field small">
            <label for="checkpoints">Контрольные точки</label>
            <textarea id="checkpoints"></textarea>
          </div>
          <div class="field small">
            <label for="docs">Документы</label>
            <textarea id="docs"></textarea>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>FAQ</h2>
        <div class="subgrid">
          <div class="field">
            <label for="faqItems">Вопросы и ответы</label>
            <textarea id="faqItems" placeholder="Можно ли согласовать доставку на конкретное время? | Да, заранее фиксируем окно приема."></textarea>
          </div>
        </div>
        <div class="status" id="status"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "aiteross_delivery_overrides";
    const defaults = {
      intro: "Поставляем твердосплавный инструмент юридическим лицам. Подтверждаем наличие, готовим маршрут и сопровождаем каждую отгрузку под ваш график снабжения.",
      warehouseAddress: "г. Санкт-Петербург, Промышленная ул., 25",
      warehousePhone: "+7 (495) 123-45-67",
      warehouseHours: "Пн-Пт, 9:00-18:00",
      heroStats: [
        { value: "24 ч", label: "обычный срок подтверждения маршрута и комплектации" },
        { value: "10 шт.", label: "минимальная партия по одной позиции в заказе" },
        { value: "B2B", label: "сопровождение счета, УПД и закрывающих документов" }
      ],
      sideNotes: [
        { title: "Согласуем способ отправки", text: "Подбираем схему поставки под склад, производство или объект, чтобы отгрузка пришла в нужное окно." },
        { title: "Фиксируем статус отгрузки", text: "Сообщаем, когда заказ собран, передан на выдачу или отправлен через транспортную компанию." },
        { title: "Работаем под график производства", text: "Помогаем распределить позиции по очередности, если часть инструмента нужна раньше остальной поставки." }
      ],
      deliveryCards: [
        { title: "Доставка по Санкт-Петербургу", text: "Организуем доставку по городу и ближайшим промышленным площадкам.", badge: "Городские поставки" },
        { title: "Отправка по России", text: "Передаем груз в транспортную компанию, согласуем упаковку и маркировку.", badge: "Через ТК" },
        { title: "Самовывоз со склада", text: "Подготовим заказ ко времени приезда вашего водителя или экспедитора.", badge: "По согласованию" }
      ],
      processSteps: [
        { num: "01", title: "Подтверждаем состав заказа", text: "Уточняем позиции, количество, упаковку и приоритеты." },
        { num: "02", title: "Согласуем маршрут", text: "Определяем способ доставки, адрес и временной интервал." },
        { num: "03", title: "Готовим документы", text: "Формируем счет, УПД и комплект отгрузочных документов." },
        { num: "04", title: "Сообщаем статус отгрузки", text: "Передаем номер отправления или подтверждение готовности." }
      ],
      conditions: [
        "Минимальная партия для оформления заказа - 10 штук по позиции, если иное не согласовано заранее.",
        "Стоимость и сроки доставки зависят от адреса, веса, типа груза и требований получателя.",
        "Хрупкие и ответственные позиции дополнительно проверяем перед упаковкой и отгрузкой."
      ],
      checkpoints: [
        "Проверка маркировки и количества мест перед отгрузкой.",
        "Подтверждение окна приема груза у получателя.",
        "Передача статуса после выдачи заказа."
      ],
      coverageList: [
        { title: "Срочные поставки по городу", text: "Собираем заказ в приоритетном порядке и согласуем ближайшее окно отгрузки." },
        { title: "Плановые отгрузки в регионы", text: "Подходит для филиалов и распределенных производств." },
        { title: "Самовывоз и складские выдачи", text: "Подготовим комплект документов и сам груз без задержек." },
        { title: "Поставка под регламент клиента", text: "Учитываем требования к упаковке, маркировке и документам." }
      ],
      docs: [
        "Счет на оплату",
        "УПД или комплект закрывающих документов",
        "Товарная накладная при необходимости",
        "Маркировка грузовых мест и сопроводительные листы"
      ],
      faqItems: [
        { q: "Можно ли согласовать доставку на конкретное время?", a: "Да. Если на площадке есть окно приема, заранее фиксируем его при подтверждении маршрута." },
        { q: "Работаете ли вы с транспортными компаниями клиента?", a: "Да. Можем передать груз в указанную вами ТК или подготовить самовывоз через вашего экспедитора." },
        { q: "Какие документы вы передаете с заказом?", a: "Подготавливаем счет, УПД и другие документы для приемки и бухгалтерии." }
      ]
    };

    const byId = (id) => document.getElementById(id);
    const statusEl = byId("status");

    function parsePairs(value, size) {
      return value.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
        const parts = line.split("|").map((p) => p.trim());
        while (parts.length < size) parts.push("");
        return parts;
      });
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...defaults, ...JSON.parse(raw) } : structuredClone(defaults);
      } catch (e) {
        return structuredClone(defaults);
      }
    }

    function fillForm(state) {
      byId("intro").value = state.intro || "";
      byId("warehouseAddress").value = state.warehouseAddress || "";
      byId("warehousePhone").value = state.warehousePhone || "";
      byId("warehouseHours").value = state.warehouseHours || "";
      byId("heroStats").value = (state.heroStats || []).map((x) => [x.value, x.label].join(" | ")).join("\n");
      byId("sideNotes").value = (state.sideNotes || []).map((x) => [x.title, x.text].join(" | ")).join("\n");
      byId("deliveryCards").value = (state.deliveryCards || []).map((x) => [x.title, x.text, x.badge].join(" | ")).join("\n");
      byId("processSteps").value = (state.processSteps || []).map((x) => [x.num, x.title, x.text].join(" | ")).join("\n");
      byId("conditions").value = (state.conditions || []).join("\n");
      byId("checkpoints").value = (state.checkpoints || []).join("\n");
      byId("coverageList").value = (state.coverageList || []).map((x) => [x.title, x.text].join(" | ")).join("\n");
      byId("docs").value = (state.docs || []).join("\n");
      byId("faqItems").value = (state.faqItems || []).map((x) => [x.q, x.a].join(" | ")).join("\n");
    }

    function collectForm() {
      return {
        intro: byId("intro").value.trim(),
        warehouseAddress: byId("warehouseAddress").value.trim(),
        warehousePhone: byId("warehousePhone").value.trim(),
        warehouseHours: byId("warehouseHours").value.trim(),
        heroStats: parsePairs(byId("heroStats").value, 2).map(([value, label]) => ({ value, label })),
        sideNotes: parsePairs(byId("sideNotes").value, 2).map(([title, text]) => ({ icon: "note", title, text })),
        deliveryCards: parsePairs(byId("deliveryCards").value, 3).map(([title, text, badge]) => ({ icon: "card", title, text, badge })),
        processSteps: parsePairs(byId("processSteps").value, 3).map(([num, title, text]) => ({ num, title, text })),
        conditions: byId("conditions").value.split("\n").map((x) => x.trim()).filter(Boolean),
        checkpoints: byId("checkpoints").value.split("\n").map((x) => x.trim()).filter(Boolean),
        coverageList: parsePairs(byId("coverageList").value, 2).map(([title, text]) => ({ icon: "coverage", title, text })),
        docs: byId("docs").value.split("\n").map((x) => x.trim()).filter(Boolean),
        faqItems: parsePairs(byId("faqItems").value, 2).map(([q, a]) => ({ q, a }))
      };
    }

    function setStatus(text) {
      statusEl.textContent = text;
      if (!text) return;
      window.clearTimeout(setStatus.timer);
      setStatus.timer = window.setTimeout(() => { statusEl.textContent = ""; }, 2600);
    }

    byId("saveBtn").addEventListener("click", () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(collectForm()));
      setStatus("Сохранено в localStorage.");
    });

    byId("resetBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      fillForm(structuredClone(defaults));
      setStatus("Сброшено к значениям по умолчанию.");
    });

    fillForm(loadState());
  </script>
</body>
</html>
